# Build bo cai MSI PlumbingSolution Revit 2024 tren may Windows cua GitHub - khong can Visual Studio tren may minh.
# Chay moi lan push len main (hoac bam "Run workflow" o tab Actions).
# Ket qua: trang Releases cua repo co ban "PlumbingSolution 2024 v1.0.<so lan chay>" kem file MSI.
name: Build MSI Revit 2024

on:
  push:
    branches: [main]
    paths:
      - "PlumbingSolution/**"
      - ".github/workflows/build-msi-2024.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MSI_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # MSBuild DAY DU cua Visual Studio co san tren may GitHub: build resx (hinh, icon cua form Login / About) dung nhu
      # build trong VS. "dotnet build" thi phai doi dinh dang resource va ship them System.Resources.Extensions.
      - uses: microsoft/setup-msbuild@v2

      # Loi bien dich gom vao MOT annotation (nhieu dong) de doc duoc qua API ma khong can tai log.
      - name: Build PlumbingSolution.dll (Release_2024)
        shell: pwsh
        run: |
          msbuild PlumbingSolution\PlumbingSolution2024\PlumbingSolution2024.csproj -restore -p:Configuration=Release_2024 -v:minimal -nologo "-flp:logfile=build.log;errorsonly"
          if ($LASTEXITCODE -ne 0) {
            $errs = Select-String -Path build.log -Pattern ': error ' | ForEach-Object { ($_.Line -replace '\s*\[[^\]]*\]\s*$', '' -replace '^.*?\\PlumbingSolution\\PlumbingSolution\\PlumbingSolution\\', '').Trim() } | Sort-Object -Unique
            if (-not $errs) { $errs = Get-Content build.log -Tail 30 }
            $msg = ($errs | Select-Object -First 300) -join '%0A'
            if ($msg.Length -gt 60000) { $msg = $msg.Substring(0, 60000) }
            Write-Output "::error title=Build errors ($($errs.Count))::$msg"
            exit 1
          }

      # Loi build hien thanh annotation (::error::) de doc duoc ngay o trang commit, khong phai mo log.
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet build PlumbingSolution\Installer_WiX_2024\PlumbingSolution_Installer_2024.wixproj -c Release -p:MsiVersion=$env:MSI_VERSION -o msi 2>&1 | Tee-Object -FilePath wix.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path wix.log -Pattern 'error' | ForEach-Object { $_.Line.Trim() }
            if (-not $lines) { $lines = Get-Content wix.log -Tail 15 }
            $lines | Select-Object -Last 20 | ForEach-Object { "::error::$_" }
            exit 1
          }

      - name: Rename MSI
        shell: pwsh
        run: Rename-Item msi\PlumbingSolution_Installer_2024.msi "PlumbingSolution_Revit2024_v$env:MSI_VERSION.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: PlumbingSolution_Revit2024_v${{ env.MSI_VERSION }}
          path: msi/*.msi

      # Chi dang Release khi build tu main; chay tay tren nhanh khac chi de kiem tra build (MSI van co o Artifacts).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "revit2024-v$env:MSI_VERSION"
          $msg = (git log -1 --pretty=%s) -replace '"', "'"
          gh release create $tag "msi\PlumbingSolution_Revit2024_v$env:MSI_VERSION.msi" `
            --target $env:GITHUB_SHA `
            --title "PlumbingSolution 2024 v$env:MSI_VERSION" `
            --notes "Commit $($env:GITHUB_SHA.Substring(0,7)): $msg"
